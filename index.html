<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Волейбол: Калибровка площадки</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #camera-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    canvas {
      position: absolute;
      touch-action: none;
      cursor: crosshair;
    }
    .controls {
      padding: 12px 16px;
      background: #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active {
      background: #1d4ed8;
    }
    #status {
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="controls">
    <div id="status">Загрузка камеры...</div>
    <button id="save-btn">Сохранить 4 точки</button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const saveBtn = document.getElementById('save-btn');

    let points = [
      { x: 0.25, y: 0.25 },
      { x: 0.75, y: 0.25 },
      { x: 0.75, y: 0.75 },
      { x: 0.25, y: 0.75 }
    ];

    let activePointIndex = -1;
    let isDragging = false;

    async function startCamera() {
      try {
        const constraints = {
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        statusEl.innerText = "Камера готова";
      } catch (err) {
        statusEl.innerText = "Ошибка камеры: " + err.message;
      }
    }

    function alignCanvasWithVideo() {
      if (!video.videoWidth || !video.videoHeight) return;

      const container = document.getElementById('camera-container');
      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;

      const videoRatio = video.videoWidth / video.videoHeight;
      const containerRatio = containerWidth / containerHeight;

      let renderWidth, renderHeight;

      if (containerRatio > videoRatio) {
        renderHeight = containerHeight;
        renderWidth = containerHeight * videoRatio;
      } else {
        renderWidth = containerWidth;
        renderHeight = containerWidth / videoRatio;
      }

      canvas.width = renderWidth;
      canvas.height = renderHeight;
      canvas.style.width = renderWidth + 'px';
      canvas.style.height = renderHeight + 'px';

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (points.length === 4) {
        ctx.beginPath();
        ctx.moveTo(points[0].x * canvas.width, points[0].y * canvas.height);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x * canvas.width, points[i].y * canvas.height);
        }
        ctx.closePath();
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 3;
        ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
        ctx.fill();
        ctx.stroke();
      }

      points.forEach((pt, index) => {
        const px = pt.x * canvas.width;
        const py = pt.y * canvas.height;

        ctx.beginPath();
        ctx.arc(px, py, 12, 0, 2 * Math.PI);
        ctx.fillStyle = activePointIndex === index ? '#ef4444' : '#22c55e';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(index + 1, px - 4, py + 4);
      });
    }

    function getEventPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) / canvas.width,
        y: (clientY - rect.top) / canvas.height
      };
    }

    function handleStart(e) {
      const pos = getEventPos(e);
      activePointIndex = points.findIndex(pt => {
        const dx = (pt.x - pos.x) * canvas.width;
        const dy = (pt.y - pos.y) * canvas.height;
        return Math.sqrt(dx * dx + dy * dy) < 30;
      });
      if (activePointIndex !== -1) {
        isDragging = true;
        draw();
      }
    }

    function handleMove(e) {
      if (!isDragging || activePointIndex === -1) return;
      e.preventDefault();
      const pos = getEventPos(e);
      points[activePointIndex].x = Math.max(0, Math.min(1, pos.x));
      points[activePointIndex].y = Math.max(0, Math.min(1, pos.y));
      draw();
    }

    function handleEnd() {
      isDragging = false;
      activePointIndex = -1;
      draw();
    }

    // Мышь (ПК)
    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    // Тачскрин (iPhone)
    canvas.addEventListener('touchstart', handleStart);
    canvas.addEventListener('touchmove', handleMove);
    canvas.addEventListener('touchend', handleEnd);

    saveBtn.addEventListener('click', () => {
      localStorage.setItem('court_calibration_points', JSON.stringify(points));
      statusEl.innerText = "Точки сохранены!";
      setTimeout(() => statusEl.innerText = "Камера готова", 2000);
    });

    const saved = localStorage.getItem('court_calibration_points');
    if (saved) {
      try { points = JSON.parse(saved); } catch (e) {}
    }

    video.addEventListener('loadedmetadata', alignCanvasWithVideo);
    window.addEventListener('resize', alignCanvasWithVideo);
    startCamera();
  </script>
</body>
</html>
