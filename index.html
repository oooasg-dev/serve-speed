<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Волейбол: Трекер скорости</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #camera-container {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    video#webcam {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    canvas {
      position: absolute;
      touch-action: none;
      z-index: 10;
    }
    #magnifier {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #3b82f6;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: none;
      pointer-events: none;
      z-index: 30;
      background: #000;
      overflow: hidden;
    }
    #magnifier-canvas {
      width: 100%;
      height: 100%;
    }
    .dpad-container {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      display: none;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(3, 40px);
      gap: 4px;
      z-index: 25;
      background: rgba(0,0,0,0.6);
      padding: 6px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .dpad-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      font-size: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .dpad-btn:active {
      background: #2563eb;
    }
    .dpad-center {
      font-size: 11px;
      font-weight: bold;
      background: rgba(37, 99, 235, 0.8);
    }
    .controls-overlay {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      right: max(16px, env(safe-area-inset-right));
      left: max(16px, env(safe-area-inset-left));
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 14px;
      z-index: 20;
      border: 1px solid rgba(255, 255, 255, 0.15);
      gap: 12px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    button.main-btn, label.main-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button#auto-btn { background: #8b5cf6; }
    button#zoom-btn { background: #4b5563; }
    label#file-label { background: #059669; }
    button#rec-btn { background: #ef4444; }
    button#rec-btn.recording {
      background: #22c55e;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    #status {
      font-size: 12px;
      color: #e5e7eb;
      line-height: 1.3;
    }

    /* Модальное окно покадровой корректировки */
    #review-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
    }
    .review-video-container {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
      overflow: hidden;
    }
    #review-video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .review-controls {
      background: rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slider-row input[type=range] {
      flex: 1;
    }
    .step-btn-group {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .step-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .confirm-btn {
      background: #22c55e !important;
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    
    <div id="magnifier">
      <canvas id="magnifier-canvas" width="120" height="120"></canvas>
    </div>

    <div class="dpad-container" id="dpad">
      <div></div>
      <div class="dpad-btn" id="btn-up">▲</div>
      <div></div>
      <div class="dpad-btn" id="btn-left">◄</div>
      <div class="dpad-btn dpad-center" id="active-pt-label">T1</div>
      <div class="dpad-btn" id="btn-right">►</div>
      <div></div>
      <div class="dpad-btn" id="btn-down">▼</div>
      <div></div>
    </div>

    <div class="controls-overlay">
      <div id="status">Камера: загрузка...<br>FPS: --</div>
      <div class="btn-group">
        <label id="file-label" class="main-btn">
          Файл
          <input type="file" id="file-input" accept="video/*" style="display:none;">
        </label>
        <button class="main-btn" id="auto-btn">Авто</button>
        <button class="main-btn" id="zoom-btn">Zoom 1x</button>
        <button class="main-btn" id="save-btn">Сохранить</button>
        <button class="main-btn" id="rec-btn">Запись</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно полуавтоматической проверки кадров -->
  <div id="review-modal">
    <div class="review-header">
      <span id="step-title">Шаг 1: Выберите кадр УДАРА (Старт)</span>
      <span id="frame-info">Кадр: 0</span>
    </div>

    <div class="review-video-container">
      <video id="review-video" playsinline muted></video>
    </div>

    <div class="review-controls">
      <div class="slider-row">
        <input type="range" id="frame-slider" min="0" max="100" value="0" step="1">
      </div>
      <div class="step-btn-group">
        <button class="step-btn" id="btn-prev-frame">◄ -1 кадр</button>
        <button class="step-btn" id="btn-next-frame">+1 кадр ►</button>
        <button class="step-btn confirm-btn" id="btn-confirm-step">Далее (Финиш) ►</button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    
    const magBox = document.getElementById('magnifier');
    const magCanvas = document.getElementById('magnifier-canvas');
    const magCtx = magCanvas.getContext('2d');
    const dpadEl = document.getElementById('dpad');

    const statusEl = document.getElementById('status');
    const saveBtn = document.getElementById('save-btn');
    const autoBtn = document.getElementById('auto-btn');
    const recBtn = document.getElementById('rec-btn');
    const zoomBtn = document.getElementById('zoom-btn');
    const fileInput = document.getElementById('file-input');
    const activePtLabel = document.getElementById('active-pt-label');

    // Элементы модального окна проверки
    const reviewModal = document.getElementById('review-modal');
    const reviewVideo = document.getElementById('review-video');
    const stepTitle = document.getElementById('step-title');
    const frameInfo = document.getElementById('frame-info');
    const frameSlider = document.getElementById('frame-slider');
    const btnPrevFrame = document.getElementById('btn-prev-frame');
    const btnNextFrame = document.getElementById('btn-next-frame');
    const btnConfirmStep = document.getElementById('btn-confirm-step');

    let videoTrack = null;
    let zoomLevels = [1, 2, 3];
    let currentZoomIndex = 0;

    let points = [
      { x: 0.3, y: 0.3 },
      { x: 0.7, y: 0.3 },
      { x: 0.8, y: 0.7 },
      { x: 0.2, y: 0.7 }
    ];

    let activePointIndex = -1;
    let isDragging = false;
    let showMagnifierTemp = false;
    let magHideTimeout = null;
    
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    let currentStep = 1; // 1 = Старт, 2 = Финиш
    let startFrameTime = 0;
    let endFrameTime = 0;
    const fps = 60; // Стандартная частота разбора видео

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 60 }
          },
          audio: false
        });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/mp4' });
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/mp4' });
          openReviewModal(URL.createObjectURL(blob));
        };

      } catch (err) {
        statusEl.innerHTML = "Ошибка: " + err.message;
      }
    }

    // Загрузка локального файла видео
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        openReviewModal(fileURL);
      }
    });

    // Открытие интерфейса проверки
    function openReviewModal(videoSrc) {
      reviewVideo.src = videoSrc;
      reviewModal.style.display = 'flex';
      currentStep = 1;
      stepTitle.innerText = "Шаг 1: Подтвердите кадр УДАРА (Старт)";
      btnConfirmStep.innerText = "Далее (К финишу) ►";

      reviewVideo.onloadedmetadata = () => {
        frameSlider.max = Math.floor(reviewVideo.duration * fps);
        // Автоматом выставляем предположительный старт (30% от видео) и финиш (70%)
        frameSlider.value = Math.floor(frameSlider.max * 0.3);
        updateVideoFrame();
      };
    }

    function updateVideoFrame() {
      const frameNum = parseInt(frameSlider.value);
      reviewVideo.currentTime = frameNum / fps;
      frameInfo.innerText = `Кадр: ${frameNum} / ${frameSlider.max} (${reviewVideo.currentTime.toFixed(2)}с)`;
    }

    frameSlider.addEventListener('input', updateVideoFrame);

    btnPrevFrame.addEventListener('click', () => {
      if (frameSlider.value > 0) {
        frameSlider.value = parseInt(frameSlider.value) - 1;
        updateVideoFrame();
      }
    });

    btnNextFrame.addEventListener('click', () => {
      if (parseInt(frameSlider.value) < parseInt(frameSlider.max)) {
        frameSlider.value = parseInt(frameSlider.value) + 1;
        updateVideoFrame();
      }
    });

    // Переключение между шагами подтверждения
    btnConfirmStep.addEventListener('click', () => {
      if (currentStep === 1) {
        startFrameTime = reviewVideo.currentTime;
        currentStep = 2;
        stepTitle.innerText = "Шаг 2: Подтвердите кадр ПРИЕМА (Финиш)";
        btnConfirmStep.innerText = "Рассчитать скорость ★";
        
        // Сдвигаем бегунок ближе к предполагаемому концу
        frameSlider.value = Math.floor(frameSlider.max * 0.7);
        updateVideoFrame();
      } else {
        endFrameTime = reviewVideo.currentTime;
        calculateBallSpeed();
      }
    });

    function calculateBallSpeed() {
      const duration = Math.abs(endFrameTime - startFrameTime);
      reviewModal.style.display = 'none';

      if (duration === 0) {
        statusEl.innerHTML = "Ошибка: Время старта и финиша совпадает!";
        return;
      }

      // Базовый расчет расстояния (стандартная длина волейбольной площадки 18м)
      const distanceMeters = 18.0; 
      const speedMPS = distanceMeters / duration;
      const speedKMH = (speedMPS * 3.6).toFixed(1);

      statusEl.innerHTML = `Скорость подачи: <b style="color:#22c55e; font-size:14px;">${speedKMH} км/ч</b><br>Время полёта: ${duration.toFixed(2)} сек.`;
    }

    // Авто-определение площадки
    autoBtn.addEventListener('click', () => {
      if (!video.videoWidth || !video.videoHeight) return;

      const tempCanvas = document.createElement('canvas');
      const sampleW = 320, sampleH = 180;
      tempCanvas.width = sampleW; tempCanvas.height = sampleH;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(video, 0, 0, sampleW, sampleH);

      const data = tempCtx.getImageData(0, 0, sampleW, sampleH).data;
      let minSum = Infinity, maxSum = -Infinity, minDiff = Infinity, maxDiff = -Infinity;
      let topL = {x: 0.2, y: 0.3}, topR = {x: 0.8, y: 0.3}, botR = {x: 0.8, y: 0.8}, botL = {x: 0.2, y: 0.8};
      let found = false;

      for (let y = 0; y < sampleH; y++) {
        for (let x = 0; x < sampleW; x++) {
          const idx = (y * sampleW + x) * 4;
          const r = data[idx], g = data[idx + 1], b = data[idx + 2];

          if (b > 80 && b > r * 1.2 && g > r * 0.9) {
            found = true;
            const sum = x + y, diff = x - y;
            if (sum < minSum) { minSum = sum; topL = { x: x / sampleW, y: y / sampleH }; }
            if (sum > maxSum) { maxSum = sum; botR = { x: x / sampleW, y: y / sampleH }; }
            if (diff > maxDiff) { maxDiff = diff; topR = { x: x / sampleW, y: y / sampleH }; }
            if (diff < minDiff) { minDiff = diff; botL = { x: x / sampleW, y: y / sampleH }; }
          }
        }
      }

      if (found) {
        points = [topL, topR, botR, botL];
        activePointIndex = 0;
        statusEl.innerHTML = "Площадка распознана!<br>Подправьте точки при необходимости.";
      } else {
        statusEl.innerHTML = "Синее покрытие не найдено.<br>Настройте вручную.";
      }
    });

    zoomBtn.addEventListener('click', async () => {
      currentZoomIndex = (currentZoomIndex + 1) % zoomLevels.length;
      const zoomVal = zoomLevels[currentZoomIndex];
      zoomBtn.innerText = `Zoom ${zoomVal}x`;

      if (videoTrack && typeof videoTrack.getCapabilities === 'function') {
        const capabilities = videoTrack.getCapabilities();
        if (capabilities.zoom) {
          try {
            await videoTrack.applyConstraints({
              advanced: [{ zoom: Math.min(zoomVal, capabilities.zoom.max) }]
            });
            return;
          } catch (e) {}
        }
      }
      video.style.transform = `scale(${zoomVal})`;
    });

    function alignCanvasWithVideo() {
      if (!video.videoWidth || !video.videoHeight) return;

      const container = document.getElementById('camera-container');
      const containerW = container.clientWidth;
      const containerH = container.clientHeight;

      const videoRatio = video.videoWidth / video.videoHeight;
      const containerRatio = containerW / containerH;

      let renderW, renderH;

      if (containerRatio > videoRatio) {
        renderH = containerH;
        renderW = containerH * videoRatio;
      } else {
        renderW = containerW;
        renderH = containerW / videoRatio;
      }

      canvas.width = renderW;
      canvas.height = renderH;
      canvas.style.width = renderW + 'px';
      canvas.style.height = renderH + 'px';

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (points.length === 4) {
        ctx.beginPath();
        ctx.moveTo(points[0].x * canvas.width, points[0].y * canvas.height);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x * canvas.width, points[i].y * canvas.height);
        }
        ctx.closePath();
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 3;
        ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
        ctx.fill();
        ctx.stroke();
      }

      points.forEach((pt, index) => {
        const px = pt.x * canvas.width;
        const py = pt.y * canvas.height;

        ctx.beginPath();
        ctx.arc(px, py, 14, 0, 2 * Math.PI);
        ctx.fillStyle = activePointIndex === index ? '#ef4444' : '#22c55e';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(index + 1, px - 4, py + 4);
      });

      if ((isDragging || showMagnifierTemp) && activePointIndex !== -1) {
        drawMagnifier(points[activePointIndex]);
      } else {
        magBox.style.display = 'none';
      }

      dpadEl.style.display = activePointIndex !== -1 ? 'grid' : 'none';

      requestAnimationFrame(draw);
    }

    function drawMagnifier(point) {
      magBox.style.display = 'block';
      const px = point.x * canvas.width;
      const py = point.y * canvas.height;

      magCtx.clearRect(0, 0, 120, 120);
      const zoom = 4;
      const sw = 120 / zoom, sh = 120 / zoom;
      const sx = (px * (video.videoWidth / canvas.width)) - sw / 2;
      const sy = (py * (video.videoHeight / canvas.height)) - sh / 2;

      magCtx.drawImage(video, sx, sy, sw, sh, 0, 0, 120, 120);

      magCtx.beginPath();
      magCtx.strokeStyle = '#ef4444';
      magCtx.lineWidth = 2;
      magCtx.moveTo(60, 40); magCtx.lineTo(60, 80);
      magCtx.moveTo(40, 60); magCtx.lineTo(80, 60);
      magCtx.stroke();
    }

    function triggerTempMagnifier() {
      showMagnifierTemp = true;
      clearTimeout(magHideTimeout);
      magHideTimeout = setTimeout(() => { showMagnifierTemp = false; }, 1500);
    }

    function moveActivePoint(dxPixels, dyPixels) {
      if (activePointIndex === -1) return;
      points[activePointIndex].x = Math.max(0, Math.min(1, points[activePointIndex].x + (dxPixels / canvas.width)));
      points[activePointIndex].y = Math.max(0, Math.min(1, points[activePointIndex].y + (dyPixels / canvas.height)));
      triggerTempMagnifier();
    }

    document.getElementById('btn-up').addEventListener('click', () => moveActivePoint(0, -1));
    document.getElementById('btn-down').addEventListener('click', () => moveActivePoint(0, 1));
    document.getElementById('btn-left').addEventListener('click', () => moveActivePoint(-1, 0));
    document.getElementById('btn-right').addEventListener('click', () => moveActivePoint(1, 0));

    activePtLabel.addEventListener('click', () => {
      activePointIndex = activePointIndex === -1 ? 0 : (activePointIndex + 1) % 4;
      activePtLabel.innerText = `T${activePointIndex + 1}`;
      triggerTempMagnifier();
    });

    function getEventPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) / canvas.width,
        y: (clientY - rect.top) / canvas.height
      };
    }

    function handleStart(e) {
      const pos = getEventPos(e);
      const clickedIdx = points.findIndex(pt => {
        const dx = (pt.x - pos.x) * canvas.width;
        const dy = (pt.y - pos.y) * canvas.height;
        return Math.sqrt(dx * dx + dy * dy) < 35;
      });
      
      if (clickedIdx !== -1) {
        activePointIndex = clickedIdx;
        activePtLabel.innerText = `T${activePointIndex + 1}`;
        isDragging = true;
      }
    }

    function handleMove(e) {
      if (!isDragging || activePointIndex === -1) return;
      e.preventDefault();
      const pos = getEventPos(e);
      points[activePointIndex].x = Math.max(0, Math.min(1, pos.x));
      points[activePointIndex].y = Math.max(0, Math.min(1, pos.y));
    }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('touchstart', handleStart);
    canvas.addEventListener('touchmove', handleMove);
    canvas.addEventListener('touchend', () => isDragging = false);

    recBtn.addEventListener('click', () => {
      if (!isRecording) {
        recordedChunks = [];
        mediaRecorder.start();
        isRecording = true;
        recBtn.innerText = "Стоп";
        recBtn.classList.add('recording');
        statusEl.innerHTML = "Запись подачи...";
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = "Запись";
        recBtn.classList.remove('recording');
      }
    });

    saveBtn.addEventListener('click', () => {
      localStorage.setItem('court_calibration_points', JSON.stringify(points));
      activePointIndex = -1;
      showMagnifierTemp = false;
      statusEl.innerHTML = "Калибровка сохранена!";
    });

    const saved = localStorage.getItem('court_calibration_points');
    if (saved) {
      try { points = JSON.parse(saved); activePointIndex = -1; } catch (e) {}
    }

    video.addEventListener('loadedmetadata', alignCanvasWithVideo);
    window.addEventListener('resize', alignCanvasWithVideo);

    startCamera();
  </script>
</body>
</html>
