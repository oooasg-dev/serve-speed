<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Волейбол: Трекер скорости</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #camera-container {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    canvas {
      position: absolute;
      touch-action: none;
    }
    #magnifier {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid #3b82f6;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: none;
      pointer-events: none;
      z-index: 30;
      background: #000;
      overflow: hidden;
    }
    #magnifier-canvas {
      width: 100%;
      height: 100%;
    }
    .dpad-container {
      position: absolute;
      bottom: max(80px, env(safe-area-inset-bottom));
      left: max(16px, env(safe-area-inset-left));
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 4px;
      z-index: 25;
      background: rgba(0,0,0,0.5);
      padding: 6px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
    }
    .dpad-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .dpad-btn:active {
      background: #2563eb;
    }
    .dpad-center {
      font-size: 12px;
      font-weight: bold;
      background: rgba(37, 99, 235, 0.6);
    }
    .controls-overlay {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      right: max(16px, env(safe-area-inset-right));
      left: max(16px, env(safe-area-inset-left));
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 14px;
      z-index: 20;
      border: 1px solid rgba(255, 255, 255, 0.15);
      gap: 12px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button.main-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    button#zoom-btn {
      background: #4b5563;
    }
    button#rec-btn {
      background: #ef4444;
    }
    button#rec-btn.recording {
      background: #22c55e;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    #status {
      font-size: 12px;
      color: #e5e7eb;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    
    <div id="magnifier">
      <canvas id="magnifier-canvas" width="130" height="130"></canvas>
    </div>

    <div class="dpad-container">
      <div></div>
      <div class="dpad-btn" id="btn-up">▲</div>
      <div></div>
      <div class="dpad-btn" id="btn-left">◄</div>
      <div class="dpad-btn dpad-center" id="active-pt-label">T1</div>
      <div class="dpad-btn" id="btn-right">►</div>
      <div></div>
      <div class="dpad-btn" id="btn-down">▼</div>
      <div></div>
    </div>

    <div class="controls-overlay">
      <div id="status">Камера: загрузка...<br>FPS: --</div>
      <div class="btn-group">
        <button class="main-btn" id="zoom-btn">Zoom 1x</button>
        <button class="main-btn" id="save-btn">Сохранить</button>
        <button class="main-btn" id="rec-btn">Запись</button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    
    const magBox = document.getElementById('magnifier');
    const magCanvas = document.getElementById('magnifier-canvas');
    const magCtx = magCanvas.getContext('2d');

    const statusEl = document.getElementById('status');
    const saveBtn = document.getElementById('save-btn');
    const recBtn = document.getElementById('rec-btn');
    const zoomBtn = document.getElementById('zoom-btn');
    const activePtLabel = document.getElementById('active-pt-label');

    let videoTrack = null;
    let zoomLevels = [1, 2, 3];
    let currentZoomIndex = 0;

    let points = [
      { x: 0.3, y: 0.3 },
      { x: 0.7, y: 0.3 },
      { x: 0.8, y: 0.7 },
      { x: 0.2, y: 0.7 }
    ];

    let activePointIndex = 0;
    let isDragging = false;
    
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recStartTime = 0;

    let frameCount = 0;
    let lastFpsTime = performance.now();
    let currentFps = 60;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 60 }
          },
          audio: false
        });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/mp4' });
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = processRecordedVideo;

      } catch (err) {
        statusEl.innerHTML = "Ошибка: " + err.message;
      }
    }

    // Переключение Зума
    zoomBtn.addEventListener('click', async () => {
      currentZoomIndex = (currentZoomIndex + 1) % zoomLevels.length;
      const zoomVal = zoomLevels[currentZoomIndex];
      zoomBtn.innerText = `Zoom ${zoomVal}x`;

      if (videoTrack && typeof videoTrack.getCapabilities === 'function') {
        const capabilities = videoTrack.getCapabilities();
        if (capabilities.zoom) {
          try {
            await videoTrack.applyConstraints({
              advanced: [{ zoom: Math.min(zoomVal, capabilities.zoom.max) }]
            });
            return;
          } catch (e) {
            console.log("Аппаратный зум недоступен, используем цифровое масштабирование");
          }
        }
      }
      
      // Запасной вариант: программный зум CSS
      video.style.transform = `scale(${zoomVal})`;
    });

    function alignCanvasWithVideo() {
      if (!video.videoWidth || !video.videoHeight) return;

      const container = document.getElementById('camera-container');
      const containerW = container.clientWidth;
      const containerH = container.clientHeight;

      const videoRatio = video.videoWidth / video.videoHeight;
      const containerRatio = containerW / containerH;

      let renderW, renderH;

      if (containerRatio > videoRatio) {
        renderH = containerH;
        renderW = containerH * videoRatio;
      } else {
        renderW = containerW;
        renderH = containerW / videoRatio;
      }

      canvas.width = renderW;
      canvas.height = renderH;
      canvas.style.width = renderW + 'px';
      canvas.style.height = renderH + 'px';

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        currentFps = Math.round((frameCount * 1000) / (now - lastFpsTime));
        frameCount = 0;
        lastFpsTime = now;
        if (!isRecording) {
          statusEl.innerHTML = `Камера готова<br>FPS: ${currentFps} | Точка: T${activePointIndex + 1}`;
        }
      }

      if (points.length === 4) {
        ctx.beginPath();
        ctx.moveTo(points[0].x * canvas.width, points[0].y * canvas.height);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x * canvas.width, points[i].y * canvas.height);
        }
        ctx.closePath();
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 3;
        ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
        ctx.fill();
        ctx.stroke();
      }

      points.forEach((pt, index) => {
        const px = pt.x * canvas.width;
        const py = pt.y * canvas.height;

        ctx.beginPath();
        ctx.arc(px, py, 14, 0, 2 * Math.PI);
        ctx.fillStyle = activePointIndex === index ? '#ef4444' : '#22c55e';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(index + 1, px - 4, py + 4);
      });

      drawMagnifier(points[activePointIndex]);

      requestAnimationFrame(draw);
    }

    function drawMagnifier(point) {
      magBox.style.display = 'block';
      
      const px = point.x * canvas.width;
      const py = point.y * canvas.height;

      magCtx.clearRect(0, 0, 130, 130);
      
      const zoom = 4;
      const sw = 130 / zoom;
      const sh = 130 / zoom;
      const sx = (px * (video.videoWidth / canvas.width)) - sw / 2;
      const sy = (py * (video.videoHeight / canvas.height)) - sh / 2;

      magCtx.drawImage(video, sx, sy, sw, sh, 0, 0, 130, 130);

      magCtx.beginPath();
      magCtx.strokeStyle = '#ef4444';
      magCtx.lineWidth = 2;
      magCtx.moveTo(65, 45); magCtx.lineTo(65, 85);
      magCtx.moveTo(45, 65); magCtx.lineTo(85, 65);
      magCtx.stroke();
    }

    function moveActivePoint(dxPixels, dyPixels) {
      const stepX = dxPixels / canvas.width;
      const stepY = dyPixels / canvas.height;

      points[activePointIndex].x = Math.max(0, Math.min(1, points[activePointIndex].x + stepX));
      points[activePointIndex].y = Math.max(0, Math.min(1, points[activePointIndex].y + stepY));
    }

    document.getElementById('btn-up').addEventListener('click', () => moveActivePoint(0, -1));
    document.getElementById('btn-down').addEventListener('click', () => moveActivePoint(0, 1));
    document.getElementById('btn-left').addEventListener('click', () => moveActivePoint(-1, 0));
    document.getElementById('btn-right').addEventListener('click', () => moveActivePoint(1, 0));

    activePtLabel.addEventListener('click', () => {
      activePointIndex = (activePointIndex + 1) % 4;
      activePtLabel.innerText = `T${activePointIndex + 1}`;
    });

    function getEventPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) / canvas.width,
        y: (clientY - rect.top) / canvas.height
      };
    }

    function handleStart(e) {
      const pos = getEventPos(e);
      const clickedIdx = points.findIndex(pt => {
        const dx = (pt.x - pos.x) * canvas.width;
        const dy = (pt.y - pos.y) * canvas.height;
        return Math.sqrt(dx * dx + dy * dy) < 35;
      });
      if (clickedIdx !== -1) {
        activePointIndex = clickedIdx;
        activePtLabel.innerText = `T${activePointIndex + 1}`;
        isDragging = true;
      }
    }

    function handleMove(e) {
      if (!isDragging || activePointIndex === -1) return;
      e.preventDefault();
      const pos = getEventPos(e);
      points[activePointIndex].x = Math.max(0, Math.min(1, pos.x));
      points[activePointIndex].y = Math.max(0, Math.min(1, pos.y));
    }

    function handleEnd() {
      isDragging = false;
    }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart);
    canvas.addEventListener('touchmove', handleMove);
    canvas.addEventListener('touchend', handleEnd);

    recBtn.addEventListener('click', () => {
      if (!isRecording) {
        recordedChunks = [];
        mediaRecorder.start();
        isRecording = true;
        recStartTime = performance.now();
        recBtn.innerText = "Стоп";
        recBtn.classList.add('recording');
        statusEl.innerHTML = "Запись подачи...<br>Нажмите Стоп после приема";
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = "Запись";
        recBtn.classList.remove('recording');
      }
    });

    function processRecordedVideo() {
      const duration = ((performance.now() - recStartTime) / 1000).toFixed(1);
      statusEl.innerHTML = `Записано: ${duration} сек.<br>Готово к расчету!`;
    }

    saveBtn.addEventListener('click', () => {
      localStorage.setItem('court_calibration_points', JSON.stringify(points));
      statusEl.innerHTML = "Калибровка сохранена!";
      setTimeout(() => statusEl.innerHTML = `Камера готова<br>FPS: ${currentFps} | Точка: T${activePointIndex + 1}`, 2000);
    });

    const saved = localStorage.getItem('court_calibration_points');
    if (saved) {
      try { points = JSON.parse(saved); } catch (e) {}
    }

    video.addEventListener('loadedmetadata', alignCanvasWithVideo);
    window.addEventListener('resize', alignCanvasWithVideo);
    window.addEventListener('orientationchange', () => setTimeout(alignCanvasWithVideo, 300));

    startCamera();
  </script>
</body>
</html>
